server:
  port: 8082

spring:
  application:
    name: warehouse-service
  data:
    mongodb:
      uri: mongodb://admin:password@mongodb:27017/warehouse_db?authSource=admin
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: warehouse-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.sparrow.warehouse_service.model.*"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sparrow.warehouse_service: DEBUG
    org.springframework.kafka: INFO